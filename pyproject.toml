[project]
name = "teel"
dynamic = ["version"]
description = "Speculative ahead-of-time parallelization of plain synchronous Python via a shadow bytecode interpreter"
authors = [{ name = "AI21" }]
readme = "README.md"
requires-python = "==3.12.13"
dependencies = []
keywords = [
    "concurrency",
    "parallelism",
    "speculative-execution",
    "lookahead",
    "bytecode",
    "cache",
    "threadpool",
    "cpython",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Repository = "https://github.com/AI21Labs/teel"
Issues = "https://github.com/AI21Labs/teel/issues"

[build-system]
requires = ["setuptools", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["teel"]

[tool.setuptools_scm]

[tool.semantic_release]
tag_format = "v{version}"
build_command = "SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION uv build --sdist"
dist_glob_patterns = ["dist/*"]
upload_to_vcs_release = true

[tool.semantic_release.branches.main]
match = "main"
