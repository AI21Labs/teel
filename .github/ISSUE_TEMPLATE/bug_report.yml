name: Bug report
description: Teel behaves differently from plain CPython, crashes, or fails to install
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what Teel did instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or traceback
      render: text
  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`. Teel currently supports only 3.12.13.
    validations:
      required: true
  - type: input
    id: teel-version
    attributes:
      label: Teel version or commit
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
