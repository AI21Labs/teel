name: Feature request
description: Suggest new behavior or support for more code patterns
labels: [feature]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and where Teel falls short today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: example
    attributes:
      label: Example code
      description: Code you would like Teel to speed up or handle.
      render: python
